<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d5d4a"/>
      <stop offset="100%" stop-color="#1f4836"/>
    </linearGradient>
    <linearGradient id="droplet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8a23a"/>
      <stop offset="100%" stop-color="#b8731a"/>
    </linearGradient>
    <filter id="cupShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Green background with rounded corners (Android adaptive icon canvas) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Cup body: trapezoid (slightly wider at top), with rounded corners -->
  <!-- Drawn as a single path: outline with slot cut out via fill-rule -->
  <g filter="url(#cupShadow)">
    <path
      d="M 156 168
         Q 156 156 168 156
         L 344 156
         Q 356 156 356 168
         L 340 396
         Q 339 412 323 412
         L 189 412
         Q 173 412 172 396
         Z

         M 178 184
         L 334 184
         L 332 212
         L 180 212
         Z"
      fill="#f5e8c8"
      fill-rule="evenodd"/>
  </g>

  <!-- Amber droplet inside the cup, lower-center -->
  <path
    d="M 256 252
       Q 256 252 308 320
       Q 308 360 282 376
       Q 256 388 230 376
       Q 204 360 204 320
       Q 256 252 256 252 Z"
    fill="url(#droplet)"/>
</svg>
